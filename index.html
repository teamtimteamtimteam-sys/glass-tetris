<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="玻璃方块">
<meta name="theme-color" content="#0b0d17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preload" href="PressStart2P.woff2" as="font" type="font/woff2" crossorigin>
<title>玻璃方块</title>
<style>
@font-face{font-family:'PS2P';src:url(PressStart2P.woff2) format('woff2');font-display:block}
:root{
  --bg:#0b0d17; --panel:#121626; --line:#d6d9e6; --edge:#2a3052; --dim:#7a819f;
  --hi:#f2c14e; --hot:#e8613c;
  --px:'PS2P',ui-monospace,monospace;
  --cjk:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
  --ctrl-h:150px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--line);font-family:var(--px);overscroll-behavior:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

/* ---------- 背景 ---------- */
#bg{position:fixed;left:0;right:0;top:0;height:var(--app-h,100%);z-index:0;background:var(--bg)}
#bg::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
#bg.pulse17{animation:p17 .9s steps(6) 1}
@keyframes p17{0%,100%{background:var(--bg)}30%{background:#2a1209}60%{background:#1c0f0b}}
#bg.pulse18{animation:p18 1.2s steps(8) 1}
@keyframes p18{0%,100%{background:var(--bg)}20%{background:#3a0f08}50%{background:#22100a}70%{background:#2e0e08}}

/* ---------- 布局 ---------- */
#app{position:fixed;left:0;right:0;top:0;height:var(--app-h,100%);z-index:1;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 4px)}
#app .ui{transition:opacity 60ms steps(2)}
#app.dim .ui{opacity:.25}

#top{display:flex;align-items:stretch;gap:8px;height:46px;flex:none;margin-bottom:10px}
.pxbox{background:var(--panel);border:3px solid var(--line);box-shadow:3px 3px 0 0 #000}
.lbl{font-size:7px;color:var(--dim);letter-spacing:1px;line-height:1}
#pauseBtn{width:46px;display:grid;place-items:center}
#pauseBtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 0 #000}
#scoreBox{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
#score{font-size:16px;color:#fff;letter-spacing:1px}
#lvBox{width:74px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
#level{font-size:14px;color:var(--hi)}

#main{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;gap:9px;position:relative}
.col{width:52px;flex:none;display:flex;flex-direction:column;gap:9px}
.col .pxbox{padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:5px}
#holdBox{position:relative;cursor:pointer}
#holdBox::before{content:'';position:absolute;inset:-14px -12px -16px -12px} /* 隐形扩大点击区 */
#holdBox.on{transform:translate(2px,2px);box-shadow:1px 1px 0 0 #000}
.stat .v{font-size:9px;color:#fff}
#comboBox .v{color:var(--hi)}
#boardWrap{position:relative;flex:none;border:4px solid var(--line);box-shadow:0 0 0 4px var(--edge),6px 6px 0 4px #000;background:#070910}
#boardWrap.bump{transform:translateY(2px)}
#boardWrap.combo{animation:cpulse .24s steps(3) 1}
@keyframes cpulse{0%{box-shadow:0 0 0 4px var(--hi),6px 6px 0 4px #000}100%{box-shadow:0 0 0 4px var(--edge),6px 6px 0 4px #000}}
#board{touch-action:none}

/* 板内文字 */
.bn{position:absolute;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;white-space:nowrap;opacity:0;z-index:2}
#banner{top:46%}
#lvBanner{top:24%}
.bn .t{display:block;text-shadow:3px 3px 0 #000}
.bn.show{animation:bnpop var(--d,.45s) steps(9) forwards}
@keyframes bnpop{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}35%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.t-tetris{font-size:20px;color:#fff}
.t-cn{margin-top:10px;text-shadow:none}
.pxcn{display:block;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges}
#boardWrap.frost{animation:frostf .7s steps(1) 1}
@keyframes frostf{
  0%{border-color:#fff;box-shadow:0 0 0 4px #9fe3ff,6px 6px 0 4px #000}
  30%{border-color:#9fe3ff;box-shadow:0 0 0 4px #4cb8cf,6px 6px 0 4px #000}
  60%{border-color:#eafaff;box-shadow:0 0 0 4px #9fe3ff,6px 6px 0 4px #000}
  100%{border-color:var(--line);box-shadow:0 0 0 4px var(--edge),6px 6px 0 4px #000}}
#boardWrap.burn{animation:burnf .7s steps(1) 1}
@keyframes burnf{
  0%{border-color:#fff;box-shadow:0 0 0 4px #ffd23f,6px 6px 0 4px #000}
  25%{border-color:#ffd23f;box-shadow:0 0 0 4px #ff8a2c,6px 6px 0 4px #000}
  50%{border-color:#ff8a2c;box-shadow:0 0 0 4px #e2452e,6px 6px 0 4px #000}
  75%{border-color:#ffd23f;box-shadow:0 0 0 4px #ff8a2c,6px 6px 0 4px #000}
  100%{border-color:var(--line);box-shadow:0 0 0 4px var(--edge),6px 6px 0 4px #000}}
#boardWrap.tetris{animation:tflash .52s steps(1) 1}
@keyframes tflash{
  0%{border-color:#fff;box-shadow:0 0 0 4px #f2c14e,6px 6px 0 4px #000}
  20%{border-color:#f2c14e;box-shadow:0 0 0 4px #ff6a3c,6px 6px 0 4px #000}
  40%{border-color:#7fd4ff;box-shadow:0 0 0 4px #a066c2,6px 6px 0 4px #000}
  60%{border-color:#fff;box-shadow:0 0 0 4px #5bb360,6px 6px 0 4px #000}
  80%{border-color:#f2c14e;box-shadow:0 0 0 4px #ff6a3c,6px 6px 0 4px #000}
  100%{border-color:var(--line);box-shadow:0 0 0 4px var(--edge),6px 6px 0 4px #000}}
.t-b2b{font-size:10px;color:#7fd4ff;margin-top:8px}
.t-combo{font-size:9px;color:var(--hi);margin-top:7px}
.t-clear{font-size:12px;color:#fff}
.t-pc{font-size:13px;color:#fff;line-height:1.6}
.t-lv{font-size:16px;color:#fff}
.t-lv.tense{color:#ffb070}
.t-lv.max{color:#ff6a3c}
.t-max{font-size:10px;color:#ff6a3c;margin-top:8px}

/* ---------- 按键 ---------- */
/* 左：旋转（占两行）；右：上排 ↓ 加速，下排 ← →。↓ 放在右手侧，离旋转远 */
#controls{flex:none;height:var(--ctrl-h);display:grid;grid-template-columns:44% 28% 28%;grid-template-rows:38% 62%;margin:8px -10px 0}
.zone{display:flex;align-items:center;justify-content:center;touch-action:none}
.zone[data-z=rot]{grid-row:1 / 3;align-items:flex-end;padding-bottom:calc(var(--ctrl-h) * .62 * .15)}
.zone[data-z=down]{grid-column:2 / 4;grid-row:1;align-items:flex-end;padding-bottom:4px}
.zone[data-z=left],.zone[data-z=right]{grid-row:2}
.zone[data-z=down] .key{width:min(194px,88%);height:min(50px,86%)}
.key{display:grid;place-items:center;background:#1a1f35;border:3px solid var(--line);box-shadow:4px 4px 0 0 #000;pointer-events:none}
.zone[data-z=rot] .key{width:min(132px,80%);height:min(84px,70%)}
.zone[data-z=left] .key,.zone[data-z=right] .key{width:min(92px,84%);height:min(84px,70%)}
.zone[data-z=left]{justify-content:flex-end;padding-right:5px}
.zone[data-z=right]{justify-content:flex-start;padding-left:5px}
.zone.on .key{transform:translate(3px,3px);box-shadow:1px 1px 0 0 #000;background:#2c3458}
.key svg{width:34px;height:34px;shape-rendering:crispEdges}

/* ---------- 特效层 ---------- */
#fx{position:fixed;left:0;top:0;z-index:4;pointer-events:none}

/* ---------- 弹层 ---------- */
.screen{position:fixed;left:0;right:0;top:0;height:var(--app-h,100%);z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 16px) 22px calc(env(safe-area-inset-bottom) + 16px);background:rgba(8,10,18,.94);overflow-y:auto;touch-action:pan-y}
.screen.show{display:flex}
.logo{font-family:var(--cjk);font-weight:900;font-size:40px;letter-spacing:6px;color:#fff;text-shadow:4px 4px 0 #4f6fcf,8px 8px 0 #000}
.logo-sub{font-size:9px;color:var(--hi);margin:14px 0 30px;letter-spacing:2px}
.menu{display:flex;flex-direction:column;gap:14px;width:min(300px,100%)}
.pxbtn{display:block;width:100%;height:54px;font-size:13px;letter-spacing:1px;background:#1a1f35;border:3px solid var(--line);box-shadow:4px 4px 0 0 #000;color:#fff}
.pxbtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 0 #000}
.pxbtn.primary{background:#2d4aa8}
.pxbtn.lock{color:var(--dim);border-color:var(--dim)}
.pxbtn small{display:block;font-family:var(--cjk);font-size:10px;color:var(--dim);margin-top:5px;letter-spacing:0}
h2{font-size:16px;color:#fff;margin-bottom:18px;text-align:center;line-height:1.5}
h2 .cn{font-family:var(--cjk);font-weight:900;font-size:22px}
.seed{font-size:9px;color:var(--hi);margin:-8px 0 16px}
.big{font-size:22px;color:#fff;margin:4px 0 14px}
.rows{width:min(320px,100%);border:3px solid var(--line);background:var(--panel);box-shadow:4px 4px 0 0 #000;margin-bottom:18px}
.rows .r{display:flex;align-items:center;gap:10px;padding:10px 10px;font-size:9px;border-top:2px solid var(--edge);line-height:1.5}
.rows .r:first-child{border-top:0}
.rows .r .k{color:var(--dim);flex:1}
.rows .r .rk{width:22px;color:var(--dim)}
.rows .r .sc{flex:1;color:#fff;font-size:11px}
.rows .r .m{color:var(--dim);font-size:7px;text-align:right;line-height:1.7}
.rows .r.me{background:#2a2a14}
.rows .r.me .sc{color:var(--hi)}
.rows .r:nth-child(1) .rk{color:var(--hi)}
.rows .empty{color:var(--edge)}
.newrec{font-size:10px;color:var(--hi);margin:-6px 0 14px;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.tabs{display:flex;gap:6px;width:min(320px,100%);margin-bottom:12px}
.tabs button{flex:1;height:38px;font-size:8px;border:3px solid var(--edge);background:var(--panel);color:var(--dim)}
.tabs button.on{border-color:var(--line);color:#fff;background:#2d4aa8}
.set .r{padding:12px 10px}
.set .val{font-size:9px;color:var(--hi);min-width:62px;text-align:right}
.set button.opt{padding:8px 10px;border:2px solid var(--line);background:#1a1f35;font-size:9px;color:var(--hi);min-width:84px}
.set input[type=range]{-webkit-appearance:none;appearance:none;width:120px;height:8px;background:var(--edge);touch-action:pan-x}
.set input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:22px;background:var(--line);border:0;box-shadow:2px 2px 0 #000}
.note{font-family:var(--cjk);font-size:11px;color:var(--dim);line-height:1.7;text-align:center;margin-top:-6px;margin-bottom:16px;width:min(320px,100%)}
#count{position:fixed;left:0;right:0;top:0;height:var(--app-h,100%);z-index:7;display:none;align-items:center;justify-content:center;pointer-events:none}
#count.show{display:flex}
#count span{font-size:56px;color:#fff;text-shadow:5px 5px 0 #000;animation:cnt .5s steps(5) forwards}
@keyframes cnt{0%{transform:scale(1.6);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:.2}}
</style>
</head>
<body>
<div id="bg"></div>

<div id="app">
  <div id="top" class="ui">
    <button id="pauseBtn" class="pxbox" aria-label="暂停">
      <svg viewBox="0 0 8 8" width="16" height="16" shape-rendering="crispEdges"><rect x="1" y="1" width="2" height="6" fill="#d6d9e6"/><rect x="5" y="1" width="2" height="6" fill="#d6d9e6"/></svg>
    </button>
    <div id="scoreBox" class="pxbox"><div class="lbl">SCORE</div><div id="score">0</div></div>
    <div id="lvBox" class="pxbox"><div class="lbl">LEVEL</div><div id="level">1</div></div>
  </div>

  <div id="main">
    <div class="col ui" id="leftCol">
      <div class="pxbox" id="holdBox" aria-label="HOLD"><div class="lbl">HOLD</div><canvas id="hold"></canvas></div>
      <div class="pxbox stat"><div class="lbl">LINES</div><div class="v" id="lines">0</div></div>
      <div class="pxbox stat" id="timeBox"><div class="lbl" id="timeLbl">TIME</div><div class="v" id="time">0:00</div></div>
    </div>
    <div id="boardWrap">
      <canvas id="board"></canvas>
      <div class="bn" id="banner"></div>
      <div class="bn" id="lvBanner"></div>
    </div>
    <div class="col ui" id="rightCol">
      <div class="pxbox"><div class="lbl">NEXT</div><canvas id="next"></canvas></div>
      <div class="pxbox stat" id="comboBox"><div class="lbl">COMBO</div><div class="v" id="combo">-</div></div>
      <div class="pxbox stat" id="b2bBox"><div class="lbl">B2B</div><div class="v" id="b2b">-</div></div>
    </div>
  </div>

  <div id="controls" class="ui">
    <div class="zone" data-z="rot" aria-label="旋转"><div class="key">
      <svg viewBox="0 0 12 12"><g fill="#fff"><rect x="4" y="1" width="3" height="1"/><rect x="7" y="0" width="1" height="3"/><rect x="8" y="1" width="1" height="1"/><rect x="2" y="2" width="2" height="1"/><rect x="1" y="3" width="1" height="6"/><rect x="2" y="9" width="2" height="1"/><rect x="4" y="10" width="4" height="1"/><rect x="8" y="9" width="2" height="1"/><rect x="10" y="4" width="1" height="5"/></g></svg>
    </div></div>
    <div class="zone" data-z="down" aria-label="加速下落"><div class="key">
      <svg viewBox="0 0 9 9"><g fill="#fff"><rect x="1" y="3" width="7" height="1"/><rect x="2" y="4" width="5" height="1"/><rect x="3" y="5" width="3" height="1"/><rect x="4" y="6" width="1" height="1"/></g></svg>
    </div></div>
    <div class="zone" data-z="left" aria-label="左移"><div class="key">
      <svg viewBox="0 0 9 9"><g fill="#fff"><rect x="5" y="1" width="1" height="7"/><rect x="4" y="2" width="1" height="5"/><rect x="3" y="3" width="1" height="3"/><rect x="2" y="4" width="1" height="1"/></g></svg>
    </div></div>
    <div class="zone" data-z="right" aria-label="右移"><div class="key">
      <svg viewBox="0 0 9 9"><g fill="#fff"><rect x="3" y="1" width="1" height="7"/><rect x="4" y="2" width="1" height="5"/><rect x="5" y="3" width="1" height="3"/><rect x="6" y="4" width="1" height="1"/></g></svg>
    </div></div>
  </div>
</div>

<canvas id="fx"></canvas>
<div id="count"></div>

<!-- 主菜单 -->
<div class="screen show" id="sMenu">
  <div class="logo">玻璃方块</div>
  <div class="logo-sub">PIXEL EDITION</div>
  <div class="menu">
    <button class="pxbtn primary" data-go="play">PLAY</button>
    <button class="pxbtn" data-go="daily">DAILY</button>
    <button class="pxbtn" data-go="survival" id="survBtn">SURVIVAL 18</button>
    <button class="pxbtn" data-go="scores">SCORES</button>
    <button class="pxbtn" data-go="settings">SETTINGS</button>
  </div>
</div>

<!-- 每日挑战说明 -->
<div class="screen" id="sDaily">
  <h2>DAILY RUN</h2>
  <div class="seed" id="dailySeed">SEED #00000</div>
  <div class="note">今天所有人用同一串方块顺序。<br>5 分钟内拿最高分，和普通模式分开记录。</div>
  <div class="rows" id="dailyRows"></div>
  <div class="menu">
    <button class="pxbtn primary" id="dailyGo">START</button>
    <button class="pxbtn" data-back>BACK</button>
  </div>
</div>

<!-- 成绩 -->
<div class="screen" id="sScores">
  <h2>SCORES</h2>
  <div class="tabs"><button data-tab="play" class="on">PLAY</button><button data-tab="daily">DAILY</button><button data-tab="survival">SURV 18</button></div>
  <div class="rows" id="scoreRows"></div>
  <div class="menu"><button class="pxbtn" data-back>BACK</button></div>
</div>

<!-- 设置 -->
<div class="screen" id="sSettings">
  <h2>SETTINGS</h2>
  <div class="rows set" id="setRows"></div>
  <div class="note">DAS：按住多久后开始连续移动　ARR：连续移动每格间隔（0 = 瞬移到墙）<br>GHOST 选项在 LEVEL 15 起生效</div>
  <div class="menu"><button class="pxbtn" data-back>BACK</button></div>
</div>

<!-- 暂停 -->
<div class="screen" id="sPause">
  <h2>PAUSED</h2>
  <div class="menu">
    <button class="pxbtn primary" id="resumeBtn">RESUME</button>
    <button class="pxbtn" id="restartBtn">RESTART</button>
    <button class="pxbtn" id="quitBtn">QUIT</button>
  </div>
</div>

<!-- 结束 -->
<div class="screen" id="sOver">
  <h2 id="overTitle">GAME OVER</h2>
  <div class="big" id="overMain">0</div>
  <div class="newrec" id="overRec" style="display:none">NEW RECORD!</div>
  <div class="rows" id="overStats"></div>
  <div class="rows" id="overTop"></div>
  <div class="menu">
    <button class="pxbtn primary" id="againBtn">RETRY</button>
    <button class="pxbtn" id="homeBtn">MENU</button>
  </div>
</div>

<script>
'use strict';
/* ================= 常量 ================= */
const COLS = 10, ROWS = 20, HID = 2, TROWS = ROWS + HID, MAX_LEVEL = 18;
// 各级自然下落一格的毫秒数：前期宽松，10 级后陡升，18 级封顶
const SPEED = [0, 900, 800, 710, 625, 550, 470, 400, 340, 290, 250, 205, 170, 140, 120, 95, 70, 45, 30];
const LOCK_DELAY = 300, MAX_RESETS = 10;
const LINES_PER_LEVEL = 50; // 每升一级要消的行数（原来是 10，放慢到 5 倍）
const spawnRot = t => t === 'I' ? 1 : 0; // 长条出场时竖着
const LINE_PTS = [0, 100, 300, 500, 800];
const PC_PTS = [0, 800, 1200, 1800, 2000];
const DAILY_MS = 5 * 60 * 1000;
const COLORS = { I:'#4cb8cf', O:'#dcbb4a', T:'#a066c2', S:'#5bb360', Z:'#cf5450', J:'#506fcb', L:'#da873d', G:'#4b5068', W:'#ffffff',
  D:'#eef2ff', D2:'#63dcff', F:'#e2452e', F2:'#ff8a2c', F3:'#ffd23f', C:'#9fe3ff', C2:'#eafaff',
  H:'#c79a5e', HS:'#ffe9b0', HS2:'#ffffff',               // 补洞块：沙色身体 + 奶油色的「塞子」格
  K:'#d9d2ff', KS:'#d9d2ff', KS2:'#ffffff',               // 易碎块：整块都是透明玻璃格（K 只用来画落点虚线框）
  A:'#f5b800', AS:'#ffd23f', AS2:'#fff6b0',                  // 牵连块：金黄；AS = 带白芯的那一格
  E:'#d94f9a', E2:'#f29cc6', ET:'#cfd6e4', ET2:'#ffffff',    // 伸缩块：洋红色的外筒 + 伸出来的银色活塞杆
  Q:'#7b6657', Q2:'#a48d7b',                                // 重压块：铸铁般的深棕
  U:'#566074', US:'#a9b3c6', US2:'#e2e8f2', UC:'#98a2b6', // 钢铁块：铁灰身体 + 钢格（US 完好，UC 已裂）

/* ================= 芯片音乐（随级别加层，不是简单倍速） ================= */
const CHORDS = [[45, 0], [41, 1], [48, 1], [43, 1]]; // Am F C G：根音 MIDI + 是否大三
const LEAD = [ // 每小节 16 个 16 分音符位置；数值 = 和弦音序号（-1 休止），只在最高强度出现
  [2, -1, 1, -1, 0, -1, 1, 2, -1, -1, 3, -1, 2, -1, 1, -1],
  [2, -1, -1, 1, 0, -1, -1, -1, 1, -1, 2, -1, 3, -1, -1, -1],
  [3, -1, 2, -1, 1, -1, 2, 3, -1, -1, 4, -1, 3, -1, 2, -1],
  [1, -1, -1, 2, 3, -1, -1, -1, 2, -1, 1, -1, 0, -1, -1, -1],
];
const Music = {
  playing: false, step: 0, next: 0, iv: null,
  start(){
    if (!SET.music || !Au.ctx || this.playing) return;
    this.playing = true; this.next = Au.ctx.currentTime + .08;
    this.iv = setInterval(() => this.tick(), 25);
  },
  stop(){ this.playing = false; clearInterval(this.iv); },
  bpm(){ return 112 + (level - 1) * 3; },
  tick(){
    const c = Au.ctx; if (!c) return;
    while (this.next < c.currentTime + .12) { this.play(this.step, this.next); this.next += 60 / this.bpm() / 4; this.step = (this.step + 1) % 64; }
  },
  play(s, t){
    const bar = s >> 4, b = s & 15, [root, maj] = CHORDS[bar], tones = [0, maj ? 4 : 3, 7, 12, 12 + (maj ? 4 : 3)];
    const out = Au.mus, L = level;
    // 贝斯
    if (b % 4 === 0) Au.tone(midi(root), .16, 'triangle', .5, t, 0, out);
    else if (L >= 6 && b % 2 === 0) Au.tone(midi(root + 12), .1, 'triangle', .35, t, 0, out);
    // 琶音
    if (L >= 4 || b % 2 === 0) Au.tone(midi(root + 24 + tones[s % 3]), .06, 'square', .07, t, 0, out);
    // 鼓
    if (L >= 5) {
      if (b === 0 || b === 8 || (L >= 12 && b === 10)) Au.tone(150, .09, 'sine', .7, t, .3, out);
      if (b === 4 || b === 12) Au.noise(.08, .35, t, 'bandpass', 1800, out);
    }
    if (L >= 10 && (L >= 15 || b % 2 === 0)) Au.noise(.025, L >= 15 ? .16 : .12, t, 'highpass', 7000, out);
    // 15 级起：额外打击层
    if (L >= 15 && (b === 3 || b === 7 || b === 11 || b === 14 || b === 15)) Au.tone(b === 15 ? 140 : 210, .07, 'sine', .45, t, .6, out);
    // 18 级：主旋律层
    if (L >= 18) { const li = LEAD[bar][b]; if (li >= 0) Au.tone(midi(root + 36 + tones[li]), .1, 'square', .09, t, 0, out); }
  },
};

/* ================= 震动反馈 ================= */
// iOS Safari 没有 navigator.vibrate；iOS 18+ 点击 <input switch> 会触发系统轻触感，借它来做震动
const Hap = {
  el: null,
  init(){
    const l = document.createElement('label'), i = document.createElement('input');
    i.type = 'checkbox'; i.setAttribute('switch', ''); i.tabIndex = -1; i.setAttribute('aria-hidden', 'true'); l.appendChild(i);
    // 放在屏幕左上角以内（不能放到屏幕外）：万一 iOS 把焦点给了它，也不会为了「露出输入框」把整页往上推
    l.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none';
    this.input = i;
    document.body.appendChild(l); this.el = l;
  },
  fire(n){
    if (!SET.haptic) return;
    const k = SET.haptic === 1 ? 1 : n;
    if (navigator.vibrate) { navigator.vibrate(k > 1 ? [20, 35, 20] : 12); return; }
    const tick = () => { this.el.click(); if (document.activeElement === this.input) this.input.blur(); pinPage(); };
    for (let j = 0; j < Math.min(k, 3); j++) j ? setTimeout(tick, j * 50) : tick();
  },
};

/* ================= 游戏状态 ================= */

const newBoard = () => Array.from({ length: TROWS }, () => Array(COLS).fill(null));
function fillQueue(){
  while (queue.length < 7) {

    if (by >= 0 && board[by][bx]) return true;

const canMove = (dx, dy) => !collide(cur.t, cur.r, cur.x + dx, cur.y + dy);

}
// —— 第 2 级专属：红色 Z 块占全部方块的 40% ——
// 只改马上要用到的前 3 块（就是 NEXT 里显示的那 3 块），并记下原来是什么；一离开第 2 级就原样换回去，其他级别的概率不受影响。
const RED_LEVEL = 2, RED_SHARE = .4;

const RED_FORCE = (RED_SHARE - (1 - SHARE_SUM) / 7) / (1 - (1 - SHARE_SUM) / 7);
let qOrig = [];
function syncRedLevel(){
  if (level === RED_LEVEL) {
    for (let i = 0; i < 3 && i < queue.length; i++) if (qOrig[i] == null) { qOrig[i] = queue[i]; if (rng() < RED_FORCE) queue[i] = 'Z'; }
  } else {
    for (let i = 0; i < qOrig.length; i++) if (qOrig[i] != null) { queue[i] = qOrig[i]; qOrig[i] = null; }
  }
}
function takeNext(){
  fillQueue(); syncRedLevel();
  const t = queue.shift(); qOrig.shift();
  syncRedLevel();

}
function spawn(){
  const t = takeNext();

}
function noteGroundReset(){
  // 在地面上移动/旋转成功：重置锁定计时，次数有限
  if (!canMove(0, 1) && lockResets < MAX_RESETS) { lockTimer = 0; lockResets++; }

function tryMove(dx){
  if (!cur || !canMove(dx, 0)) return false;
  cur.x += dx; noteGroundReset(); return true;

function stepDown(){

// 伸缩块：在 3 格和 5 格之间切换（上面被挡住伸不出去时不变）
function toggleLen(){
  const to = cur.r ? 0 : 1;
  if (collide('E', to, cur.x, cur.y)) return false;
  cur.r = to; noteGroundReset(); fxExtend(to); Sfx.extend(to);

}
function rotateCW(){
  if (!cur || cur.t === 'O' || cur.t === 'D' || cur.t === 'F') return false;
  if (cur.t === 'E') return toggleLen();
  const from = cur.r, to = (from + 1) % 4;
  const sh = cur.t === 'H' ? 2 : 0; // 补洞块出场时塞子朝下，相当于标准 T 形转了半圈，踢墙表要错开两格查

    if (!collide(cur.t, to, cur.x + kx, cur.y - ky)) {
      cur.x += kx; cur.y -= ky; cur.r = to;
      if (cur.y > lowestY) { lowestY = cur.y; lockResets = 0; lockTimer = 0; }

function doHold(){
  if (!cur || holdUsed) return false;

  if (hold) { const h = hold; hold = t; placePiece(h); }
  else { hold = t; placePiece(takeNext()); }
  holdUsed = true; drawSide(); Sfx.hold(); fxHold();

}

function dotTargetY(){ for (let y = TROWS - 1; y > cur.y; y--) if (!board[y][cur.x]) return y; return cur.y; }
// 火焰方块落地：它一路下来的两列，加上左右各一列，这 4 列里已经落地的方块全部烧掉；火焰方块自己也消失
function burnFire(){
  const bx = cur.x, by = cur.y, hit = [], cols = [];
  for (let x = bx - 1; x <= bx + 2; x++) {
    if (x < 0 || x >= COLS) continue;
    cols.push(x);
    for (let y = 0; y < TROWS; y++) if (board[y][x]) { hit.push([x, y, board[y][x]]); board[y][x] = null; }

function addGarbageRow(){
  let top = TROWS; for (let y = 0; y < TROWS; y++) if (board[y].some(Boolean)) { top = y; break; }
  const gy = top - 1; if (gy < 0) return false;

  for (let x = 0; x < COLS; x++) if (rng() < .65) { row[x] = 'X'; filled++; }

const linePts = n => n <= 4 ? LINE_PTS[n] : LINE_PTS[4] + (n - 4) * 300;

// 每株每回合朝四周随机一个空位长出一格；四面都被挡住就不长。回合数记在格子自己身上，行被消掉、下移时会跟着走。
function growPlants(blocked){
  const taken = (x, y) => blocked.some(([bx, by]) => bx === x && by === y);
  const seen = new Set(), groups = [];
  for (let y = 0; y < TROWS; y++) for (let x = 0; x < COLS; x++) {
    const k = board[y][x];
    if (!k || k.length !== 2 || k[0] !== 'Y' || seen.has(y * COLS + x)) continue;
    const cells = [], stack = [[x, y]]; seen.add(y * COLS + x);
    while (stack.length) {
      const [cx, cy] = stack.pop(); cells.push([cx, cy]);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cx + dx, ny = cy + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= TROWS || board[ny][nx] !== k || seen.has(ny * COLS + nx)) continue;
        seen.add(ny * COLS + nx); stack.push([nx, ny]);

    }
    groups.push({ k, cells });
  }
  const grown = [];
  for (const g of groups) {
    const cand = [];
    for (const [cx, cy] of g.cells) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || nx >= COLS || ny < HID || ny >= TROWS || board[ny][nx] || taken(nx, ny)) continue;

    for (let yy = y; yy > 0; yy--) board[yy][x] = board[yy - 1][x];

    lb.push({ id, score, lines, level, time: now }); lb.sort((a, b) => b.score - a.score || a.time - b.time);

    d.runs++; if (!d.best || score > d.best.score) { rec = d.best !== null || score > 0; d.best = { score, lines, level, time: now, id }; }
    all[k] = d; store.set(K_DAILY, all);

/* ================= 主循环：输入事件即时生效，这里只跑重力/锁定/DAS ================= */
const softMs = () => Math.min(SPEED[level], Math.max(45, SPEED[level] / 10));
function update(dt){
  if (state === 'play' && cur) {
    playTime += dt;
    if (mode === 'daily' && playTime >= DAILY_MS) { playTime = DAILY_MS; endRun('time'); return; }
    // DAS / ARR（与重力无关，按真实时间推进）
    if (input.dir) {
      input.dasT += dt;
      if (input.dasT >= SET.das) {
        if (SET.arr <= 0) { while (tryMove(input.dir)); }
        else {
          input.arrT += dt;
          while (input.arrT >= SET.arr) { input.arrT -= SET.arr; if (!tryMove(input.dir)) { input.arrT = 0; break; } }
        }
      }
    }
    // 重力
    if (canMove(0, 1)) {
      const iv = input.soft ? softMs() : SPEED[level];
      dropAcc += dt;
      while (dropAcc >= iv) {
        dropAcc -= iv;
        stepDown(); if (input.soft) score += 1;
        if (!canMove(0, 1)) { dropAcc = 0; break; }
      }
    }
    // 锁定
    if (!canMove(0, 1)) {
      lockTimer += dt;
      if (lockTimer >= LOCK_DELAY) lock();
    }
  } else if (state === 'dying') {
    dieT += dt;
    if (dieT >= 700) endRun('top');
  }
}

        const sy = (y - HID) * CD, W = COLS * CD, u = Math.max(1, Math.round(CD / 10)), t = performance.now(), ph = Math.floor(t / 150);

// 火焰方块下落时：头顶一团跳动的像素火舌；它落地会烧到的那几列微微发红，提前告诉玩家范围

function drawAura(t, cs){
  const u = Math.max(1, Math.round(CD / 8)), fr = Math.floor(t / 50);
  const xs = cs.map(([cx]) => cur.x + cx), ys = cs.map(([, cy]) => cur.y + cy);
  const x0 = Math.min(...xs) * CD, w = (Math.max(...xs) - Math.min(...xs) + 1) * CD;

  for (let yy = -(bot - top); yy < tall; yy += u) {            // 从块的底边一直画到头顶上方
    const h = Math.max(0, yy) / tall;
    for (let xx = -3 * u; xx < w + 3 * u; xx += u) {
      const inside = xx >= 0 && xx < w && yy < 0;
      if (inside) continue;                                     // 块本身不盖住
      const n = ((Math.floor(xx / u) * 11 + Math.floor(yy / u) * 5 + fr * 7) % 13 + 13) % 13 / 13;
      const side = xx < 0 ? -xx / (3 * u) : xx >= w ? (xx - w + u) / (3 * u) : 0;  // 两侧越往外越稀

  b.classList.toggle('lock', !unlocked());
  b.innerHTML = unlocked() ? 'SURVIVAL 18' : 'SURVIVAL 18<small>在 PLAY 中到达 LEVEL 18 解锁</small>';
}
function topRows(m, hi){
  if (m === 'play') {
    const lb = store.get(K_PLAY, []);
    return [0, 1, 2, 3, 4].map(i => { const e = lb[i]; return e ? `<div class="r ${e.id === hi ? 'me' : ''}"><span class="rk">${i + 1}</span><span class="sc">${e.score.toLocaleString()}</span><span class="m">LV ${e.level} · ${e.lines}L<br>${fmtDate(e.time)}</span></div>` : `<div class="r"><span class="rk">${i + 1}</span><span class="sc empty">-----</span></div>`; }).join('');
  }
  if (m === 'survival') {
    const lb = store.get(K_SURV, []);
    return [0, 1, 2, 3, 4].map(i => { const e = lb[i]; return e ? `<div class="r ${e.id === hi ? 'me' : ''}"><span class="rk">${i + 1}</span><span class="sc">${fmtTimeFine(e.ms)}</span><span class="m">${e.lines}L · C${e.maxCombo} · T${e.tetrises}<br>${fmtDate(e.time)}</span></div>` : `<div class="r"><span class="rk">${i + 1}</span><span class="sc empty">-:--.-</span></div>`; }).join('');
  }
  const all = store.get(K_DAILY, {}), keys = Object.keys(all).sort().reverse().slice(0, 5);
  if (!keys.length) return `<div class="r"><span class="sc empty">NO RUNS YET</span></div>`;
  return keys.map(k => { const d = all[k]; return `<div class="r ${d.best && d.best.id === hi ? 'me' : ''}"><span class="sc">${d.best ? d.best.score.toLocaleString() : 0}</span><span class="m">${k.slice(5).replace('-', '/')} · #${dailySeed(k) % 100000}<br>${d.runs} RUNS</span></div>`; }).join('');
}
function openDaily(){
  const k = todayKey(), d = store.get(K_DAILY, {})[k];
  $('#dailySeed').textContent = 'SEED #' + (dailySeed(k) % 100000);
  $('#dailyRows').innerHTML = `<div class="r"><span class="k">TODAY BEST</span><span class="val" style="color:#fff">${d && d.best ? d.best.score.toLocaleString() : '-'}</span></div><div class="r"><span class="k">RUNS</span><span class="val" style="color:#fff">${d ? d.runs : 0}</span></div>`;
  showScreen('sDaily');
}
let scoreTab = 'play';
function openScores(tab){
  scoreTab = tab || scoreTab;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === scoreTab));
  $('#scoreRows').innerHTML = topRows(scoreTab, null);
  showScreen('sScores');
}
const SET_ROWS = [
  ['sound', 'SOUND', 'toggle'], ['music', 'MUSIC', 'toggle'],
  ['haptic', 'HAPTIC', 'cycle', [0, 1, 2], ['OFF', 'LOW', 'HIGH']],
  ['ghost', 'GHOST', 'cycle', ['normal', 'dim', 'off'], ['NORMAL', 'DIM', 'OFF']],
  ['das', 'DAS', 'range', 50, 200, 5, 'ms'], ['arr', 'ARR', 'range', 0, 50, 1, 'ms'],
  ['touch', 'TOUCH AREA', 'cycle', ['S', 'M', 'L'], ['SMALL', 'MEDIUM', 'LARGE']],
];
function openSettings(){
  const rows = $('#setRows');
  rows.innerHTML = SET_ROWS.map(([k, name, type, a, b, step, unit]) => {
    if (type === 'range') return `<div class="r"><span class="k">${name}</span><input type="range" min="${a}" max="${b}" step="${step}" value="${SET[k]}" data-k="${k}"><span class="val" id="v_${k}">${SET[k]}${unit}</span></div>`;
    const label = type === 'toggle' ? (SET[k] ? 'ON' : 'OFF') : b[a.indexOf(SET[k])];
    return `<div class="r"><span class="k">${name}</span><button class="opt" data-k="${k}">${label}</button></div>`;
  }).join('');
  rows.querySelectorAll('button.opt').forEach(btn => btn.onclick = () => {
    const def = SET_ROWS.find(r => r[0] === btn.dataset.k), k = def[0];
    if (def[2] === 'toggle') SET[k] = !SET[k];
    else { const opts = def[3]; SET[k] = opts[(opts.indexOf(SET[k]) + 1) % opts.length]; }
    saveSet(); Au.init();
    if (k === 'haptic' && SET.haptic) Hap.fire(SET.haptic);
    if (k === 'touch') layout();
    openSettings();
  });
  rows.querySelectorAll('input[type=range]').forEach(inp => inp.oninput = () => {
    const k = inp.dataset.k; SET[k] = +inp.value; saveSet();
    $('#v_' + k).textContent = SET[k] + 'ms';
  });
  showScreen('sSettings');
}
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
  Au.init();
  const g = b.dataset.go;
  if (g === 'play') startGame('play');
  else if (g === 'daily') openDaily();
  else if (g === 'survival') { if (unlocked()) startGame('survival'); else { b.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], { duration: 180, easing: 'steps(3)' }); } }
  else if (g === 'scores') openScores('play');
  else if (g === 'settings') openSettings();
}));
document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', toMenu));
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => openScores(b.dataset.tab)));
$('#dailyGo').onclick = () => startGame('daily');
$('#pauseBtn').addEventListener('pointerup', e => { e.preventDefault(); state === 'pause' ? resumeGame() : pauseGame(); });
$('#resumeBtn').onclick = resumeGame;
$('#restartBtn').onclick = () => startGame(mode);
$('#quitBtn').onclick = toMenu;
$('#againBtn').onclick = () => startGame(mode);
$('#homeBtn').onclick = toMenu;

/* ================= 启动 ================= */
addEventListener('resize', () => layout());
addEventListener('orientationchange', () => setTimeout(layout, 300));
addEventListener('pageshow', () => layout());
if (window.visualViewport) visualViewport.addEventListener('resize', () => layout());
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(mainEl);
[100, 400, 1000].forEach(t => setTimeout(layout, t));

let last = performance.now(), hudT = 0;
function frame(now){
  const dt = Math.min(50, now - last); last = now;
  update(dt);
  updateFx(dt);
  hudT += dt; if (hudT > 50) { hudT = 0; updateHUD(); }
  render();
  requestAnimationFrame(frame);
}
Hap.init();
refreshMenu();
layout();
updateHUD();
requestAnimationFrame(t => { last = t; frame(t); });

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
